<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>photoX</title>
  </head>
  <body>
    <div id="fatal-error" style="display:none; background:red; color:white; padding:20px; position:fixed; top:0; left:0; right:0; z-index:99999;">
      發生嚴重錯誤：<span id="fatal-error-msg"></span>
    </div>
    <script>
      window.onerror = function(msg, url, line) {
        var el = document.getElementById('fatal-error');
        if (el) {
          el.style.display = 'block';
          document.getElementById('fatal-error-msg').innerText = msg + ' (line ' + line + ')';
        }
      };
    </script>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
