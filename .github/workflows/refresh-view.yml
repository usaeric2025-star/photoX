name: Refresh Materialized View

on:
  schedule:
    # 每 5 分鐘執行一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動觸發

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        run: |
          curl -X GET https://photo-x-one.vercel.app/api/cron/refresh-view
