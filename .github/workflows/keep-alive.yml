name: Keep Alive

on:
  schedule:
    # Run every 10 minutes to keep serverless functions and DB warm
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Use APP_URL secret if defined, otherwise fallback to the default preview URL
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://ais-pre-glips4zfhb5jnvvd3juzrc-327679015073.asia-east1.run.app"
          fi
          
          echo "Pinging health endpoint at: $URL/api/health"
          
          RESPONSE=$(curl -sL --connect-timeout 15 --max-time 45 -w "\nHTTP_STATUS:%{http_code}" "$URL/api/health")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | grep 'HTTP_STATUS:' | cut -d':' -f2)
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Keep-alive ping failed with status $STATUS"
            exit 1
          else
            echo "✅ Keep-alive ping succeeded"
          fi
