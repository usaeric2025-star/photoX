<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/react-image-gallery/1.3.0/styles/css/image-gallery.min.css" />
    <title>photoX</title>
    <!-- 全局启动错误捕获 with Diagnosis (Global Startup Error Catcher) -->
    <script>
      (function() {
        var errors = [];
        window.__STARTUP_ERRORS__ = errors;
        function renderErrorOverlay() {
          if (errors.length === 0) return;
          var errorDiv = document.getElementById('startup-error-overlay');
          if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.id = 'startup-error-overlay';
            errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;color:#dc2626;padding:24px;box-sizing:border-box;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-y:auto;display:flex;flex-direction:column;';
            errorDiv.innerHTML = ' \
              <div style="max-width: 600px; margin: 40px auto; width: 100%; line-height: 1.5;"> \
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;"> \
                  <svg style="width: 28px; height: 28px; fill: #dc2626;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> \
                  <h1 style="font-size: 22px; font-weight: 700; margin: 0; color: #dc2626;">浏览器启动异常 (Startup Error)</h1> \
                </div> \
                <p style="font-size: 14px; color: #4b5563; margin-top: 0; margin-bottom: 20px;">页面加载或脚本执行过程中发生了未经捕获的例外错误。您可以点击下方按钮复制诊断信息，或尝试重新加载。</p> \
                <div id="startup-error-logs" style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 20px; font-family: ui-monospace, SFMono-Regular, Menlow, Monaco, Consolas, monospace; font-size: 13px; color: #111827; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;"></div> \
                <div style="display: flex; gap: 12px;"> \
                  <button id="copy-startup-dia" style="background: #2563eb; color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;">一键复制诊断信息</button> \
                  <button onclick="window.location.reload()" style="background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;">重新加载页面</button> \
                </div> \
              </div>';
            document.body.appendChild(errorDiv);
            document.getElementById('copy-startup-dia').onclick = function() {
              var txt = "--- 启动诊断信息 ---\n" +
                        "时间戳: " + new Date().toISOString() + "\n" +
                        "浏览器环境: " + navigator.userAgent + "\n" +
                        "URL: " + window.location.href + "\n" +
                        "异常详情:\n" + errors.map(function(e, i) {
                          return (i + 1) + ". [" + e.type + "] " + e.msg + (e.details ? "\n" + e.details : "");
                        }).join("\n---\n") + "\nTrace ID: TRACE-STARTUP-" + Math.random().toString(36).substr(2, 9).toUpperCase();
              navigator.clipboard.writeText(txt).then(function() {
                alert('诊断信息已复制到剪贴板！');
              }).catch(function() {
                var temp = document.createElement('textarea');
                temp.value = txt;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                alert('诊断信息已复制到剪贴板！');
              });
            };
          }
          var logEl = document.getElementById('startup-error-logs');
          if (logEl) {
            logEl.textContent = errors.map(function(e) {
              return "[" + e.type + "] " + e.msg + (e.details ? "\n" + e.details : "");
            }).join("\n\n");
          }
        }
        window.__RENDER_STARTUP_ERROR__ = renderErrorOverlay;

        window.onerror = function(message, source, lineno, colno, error) {
          var msgStr = String(message || '');
          if (/ResizeObserver|websocket|hmr|AbortError/i.test(msgStr)) return;

          // 🚀 Long-term Chunk Error Recovery (自动恢复最新版本)
          if (/chunk|dynamically imported|module script|Failed to fetch/i.test(msgStr)) {
            var reloadKey = '__chunk_fatal_reload__';
            var lastReload = sessionStorage.getItem(reloadKey);
            var now = Date.now();
            // 10秒内只允许自动重载一次，避免无限循环
            if (!lastReload || (now - parseInt(lastReload)) > 10000) {
              sessionStorage.setItem(reloadKey, now);
              window.location.reload();
              return;
            }
          }

          var details = "源地址: " + source + "\n位置: 行 " + lineno + ", 列 " + colno + (error && error.stack ? "\n调用栈:\n" + error.stack : "");
          errors.push({ msg: msgStr, type: "运行期异常 (Runtime Error)", details: details });
          renderErrorOverlay();
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (!reason) return;
          var msg = reason.message || String(reason || '');
          if (/ResizeObserver|websocket|hmr|AbortError|AbortSignal|signal timed out|TimeoutError/i.test(msg)) return;

          // 🚀 同样处理 Promise 拒绝中的 Chunk 错误
          if (/chunk|dynamically imported|module script|Failed to fetch/i.test(msg)) {
             var reloadKey = '__chunk_fatal_reload__';
             var lastReload = sessionStorage.getItem(reloadKey);
             var now = Date.now();
             if (!lastReload || (now - parseInt(lastReload)) > 10000) {
               sessionStorage.setItem(reloadKey, now);
               window.location.reload();
               return;
             }
          }

          var details = reason.stack ? "调用栈:\n" + reason.stack : "位置: 匿名异步拒绝";
          errors.push({ msg: msg, type: "异步拒绝异常 (Promise Rejection)", details: details });
          renderErrorOverlay();
        });

        window.__APP_READY__ = false;
        // 🚀 Watchdog Timer for Blank Page / Stuck Loading detection
        setTimeout(function() {
          var isAppReady = window.__APP_READY__ === true;
          if (!isAppReady && errors.length === 0) {
             console.warn('App still loading after 12s. Forcing diagnostics UI...');
             var diagBtn = document.createElement('button');
             diagBtn.innerText = '⚠️ 啟動過久？點此診斷 (Timeout? Click to diagnose)';
             diagBtn.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999999;background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:bold;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);cursor:pointer;';
             diagBtn.onclick = function() {
                var probe = { msg: "應用程序載入逾時 (App Load Timeout)", type: "效能/加載警告", details: "應用程序在 12 秒內未完成啟動渲染。正在探測後端系統..." };
                errors.push(probe);
                renderErrorOverlay();
                fetch('/api/health').then(function(r){return r.json()}).then(function(d){
                  probe.details += "\n\n[後端探測成功]: " + JSON.stringify(d, null, 2);
                  renderErrorOverlay();
                }).catch(function(e){
                  probe.details += "\n\n[後端探測失敗]: " + e.message;
                  renderErrorOverlay();
                });
             };
             document.body.appendChild(diagBtn);
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <style>
      #app-startup-skeleton {
        width: 100%;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        transition: opacity 0.3s ease-out;
      }
      /* 頂部導航骨架 */
      .skeleton-header {
        height: 56px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      .skeleton-logo {
        width: 100px;
        height: 24px;
        background-color: #f5f5f5;
        border-radius: 4px;
      }
      /* 照片牆骨架陣列 */
      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 2px;
        padding-top: 16px;
        flex: 1;
      }
      .skeleton-item {
        background-color: #f5f5f5;
        aspect-ratio: 1;
        width: 100%;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
    </style>
    <div id="root">
      <div id="app-startup-skeleton">
        <div class="skeleton-header">
          <div class="skeleton-logo"></div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
        </div>
      </div>
    </div>
    <div id="portal-root"></div>
    <div id="loading-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
