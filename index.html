<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>photoX</title>
  </head>
  <body>
    <div id="fatal-error" style="display:none; background:red; color:white; padding:20px; position:fixed; top:0; left:0; right:0; z-index:99999;">
      發生嚴重錯誤：<span id="fatal-error-msg"></span>
    </div>
    <script>
      window.onerror = function(msg, url, line) {
        var el = document.getElementById('fatal-error');
        if (el) {
          el.style.display = 'block';
          document.getElementById('fatal-error-msg').innerText = msg + ' (line ' + line + ')';
        }
      };
    </script>
    <style>
      #app-startup-skeleton {
        position: fixed;
        inset: 0;
        background-color: #ffffff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        transition: opacity 0.3s ease-out;
      }
      /* 頂部導航骨架 */
      .skeleton-header {
        height: 56px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      .skeleton-logo {
        width: 100px;
        height: 24px;
        background-color: #f5f5f5;
        border-radius: 4px;
      }
      /* 照片牆骨架陣列 */
      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 2px;
        padding-top: 16px;
        flex: 1;
      }
      .skeleton-item {
        background-color: #f5f5f5;
        aspect-ratio: 1;
        width: 100%;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
    </style>
    <div id="app-startup-skeleton">
      <div class="skeleton-header">
        <div class="skeleton-logo"></div>
      </div>
      <div class="skeleton-grid">
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
