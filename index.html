<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>photoX</title>
    <!-- 全局啟動錯誤捕獲與診斷器 (Startup Error Handler and Diagnosis Overlay) -->
    <script>
      (function() {
        var errors = [];
        window.__STARTUP_ERRORS__ = errors;
        function renderErrorOverlay() {
          if (errors.length === 0) return;
          var errorDiv = document.getElementById('startup-error-overlay');
          if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.id = 'startup-error-overlay';
            errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;color:#dc2626;padding:24px;box-sizing:border-box;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-y:auto;display:flex;flex-direction:column;';
            errorDiv.innerHTML = ' \
              <div style="max-width: 600px; margin: 40px auto; width: 100%; line-height: 1.5;"> \
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;"> \
                  <svg style="width: 28px; height: 28px; fill: #dc2626;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> \
                  <h1 style="font-size: 22px; font-weight: 700; margin: 0; color: #dc2626;">流覽器啟動異常 (Startup Error)</h1> \
                </div> \
                <p style="font-size: 14px; color: #4b5563; margin-top: 0; margin-bottom: 20px;">頁面載入或腳本執行過程中發生了未經捕獲的例外錯誤。您可以點擊下方按鈕複製診斷資訊，或嘗試重新載入。</p> \
                <div id="startup-error-logs" style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 20px; font-family: ui-monospace, SFMono-Regular, Menlow, Monaco, Consolas, monospace; font-size: 13px; color: #111827; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;"></div> \
                <div style="display: flex; gap: 12px;"> \
                  <button id="copy-startup-dia" style="background: #2563eb; color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;">一鍵複製診斷資訊</button> \
                  <button onclick="window.location.reload()" style="background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;">重新載入頁面</button> \
                </div> \
              </div>';
            document.body.appendChild(errorDiv);
            document.getElementById('copy-startup-dia').onclick = function() {
              var txt = "--- 啟動診斷資訊 ---\n" +
                        "時間戳: " + new Date().toISOString() + "\n" +
                        "瀏覽器環境: " + navigator.userAgent + "\n" +
                        "URL: " + window.location.href + "\n" +
                        "異常詳情:\n" + errors.map(function(e, i) {
                          return (i + 1) + ". [" + e.type + "] " + e.msg + (e.details ? "\n" + e.details : "");
                        }).join("\n---\n") + "\nTrace ID: TRACE-STARTUP-" + Math.random().toString(36).substr(2, 9).toUpperCase();
              navigator.clipboard.writeText(txt).then(function() {
                alert('診斷資訊已複製到剪貼簿！');
              }).catch(function() {
                var temp = document.createElement('textarea');
                temp.value = txt;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                alert('診斷資訊已複製到剪貼簿！');
              });
            };
          }
          var logEl = document.getElementById('startup-error-logs');
          if (logEl) {
            logEl.textContent = errors.map(function(e) {
              return "[" + e.type + "] " + e.msg + (e.details ? "\n" + e.details : "");
            }).join("\n\n");
          }
        }
        window.__RENDER_STARTUP_ERROR__ = renderErrorOverlay;

        window.onerror = function(message, source, lineno, colno, error) {
          var msgStr = String(message || '');
          if (/ResizeObserver|websocket|hmr|AbortError/i.test(msgStr)) return;
          var details = "源位址: " + source + "\n位置: 行 " + lineno + ", 列 " + colno + (error && error.stack ? "\n呼叫棧:\n" + error.stack : "");
          errors.push({ msg: msgStr, type: "運行期異常 (Runtime Error)", details: details });
          renderErrorOverlay();
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (!reason) return;
          var msg = reason.message || String(reason || '');
          if (/ResizeObserver|websocket|hmr|AbortError|AbortSignal/i.test(msg)) return;
          var details = reason.stack ? "呼叫棧:\n" + reason.stack : "位置: 匿名非同步拒絕";
          errors.push({ msg: msg, type: "非同步拒絕異常 (Promise Rejection)", details: details });
          renderErrorOverlay();
        });
      })();
    </script>
  </head>
  <body>
    <style>
      #app-startup-skeleton {
        width: 100%;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        transition: opacity 0.3s ease-out;
      }
      /* 頂部導航骨架 */
      .skeleton-header {
        height: 56px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      .skeleton-logo {
        width: 100px;
        height: 24px;
        background-color: #f5f5f5;
        border-radius: 4px;
      }
      /* 照片牆骨架陣列 */
      .skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 2px;
        padding-top: 16px;
        flex: 1;
      }
      .skeleton-item {
        background-color: #f5f5f5;
        aspect-ratio: 1;
        width: 100%;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
    </style>
    <div id="root">
      <div id="app-startup-skeleton">
        <div class="skeleton-header">
          <div class="skeleton-logo"></div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
          <div class="skeleton-item"></div><div class="skeleton-item"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
